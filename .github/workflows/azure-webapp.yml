# Testa e publica o Gateway/BFF no Azure Web App (App Service, Node 20, Linux).
# Configure no GitHub: Settings > Secrets and variables > Actions
#   secret   AZURE_WEBAPP_PUBLISH_PROFILE  (Web App > Visão geral > Baixar perfil de publicação)
#   variable AZURE_WEBAPP_NAME             (nome do Web App, ex.: praticom-gateway)
name: Deploy Gateway/BFF (Azure Web App)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm prune --omit=dev
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
